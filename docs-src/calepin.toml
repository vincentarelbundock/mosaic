title = "Mosaic"
description = "Tree-based slide grids and incremental reveals for Typst."
theme = "./theme"
logo = "assets/mosaic-slide.svg"
logo_alt = "Mosaic"
pdf = false
search = "pagefind"
asset-dir = "_calepin"

[static]
include = ["assets/**", "examples/**/*.pdf", "examples/**/cover.jpg"]

[pages]
exclude = [
  "_includes/**",
  "api/_page.typ",
  "api/generated/**",
  "api/sources/**",
  "examples/**",
]

[toc]
enabled = true
depth = 3

[menus]

  [[menus.main]]
  target = "examples.typ"
  label = "Examples"

  [[menus.main]]
  target = "start/first-deck.typ"
  label = "Get started"

  [[menus.main]]
  target = "api.typ"
  label = "API"

  [[menus.social]]
  target = "https://github.com/vincentarelbundock/mosaic"
  label = "{icon:github}"
  aria-label = "GitHub"

  # Lucide, the default icon set, has no Bluesky mark, so this one names its
  # set explicitly.
  [[menus.social]]
  target = "https://bsky.app/profile/vincentab.bsky.social"
  label = "{icon:simple-icons:bluesky}"
  aria-label = "Bluesky"

[[footer.item]]
label = "Mosaic 0.0.1 · Built with Typst and Calepin."


