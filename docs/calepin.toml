title = "Mosaic"
description = "Tree-based slide grids and incremental reveals for Typst."
theme = "./theme"
logo = "assets/mosaic-slide.svg"
logo_alt = "Mosaic"
pdf = false
# search = "pagefind"
asset-dir = "_calepin"

[static]
include = ["assets/**", "examples/**/*.pdf", "examples/**/cover.jpg"]

[pages]
exclude = [
  "_includes/**",
  "api/_module.typ",
  "api/modules/**",
  "api/sources/**",
  "examples/**",
]

[toc]
enabled = true
depth = 3

[menus]

  [[menus.main]]
  target = "examples.typ"
  label = "Examples"

  [[menus.main]]
  target = "basics.typ"
  label = "Get started"

  [[menus.main]]
  target = "api/setup.typ"
  label = "API"

[[footer.item]]
label = "Mosaic 0.0.1 · Built with Typst and Calepin."

